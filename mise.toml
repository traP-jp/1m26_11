[tools]
node = "24"
pnpm = "11.5.0"
python = "3.12"
rust = "stable"

[tasks.build]
description = "Build the server"
dir = "server"
run = "cargo build --locked"

[tasks.fmt]
description = "Format the server"
dir = "server"
run = """
cargo fmt --all
cargo fmt --manifest-path generated/openapi/Cargo.toml --all
"""

[tasks.fmt-check]
description = "Check server formatting"
dir = "server"
run = """
cargo fmt --all -- --check
cargo fmt --manifest-path generated/openapi/Cargo.toml --all -- --check
"""

[tasks.lint]
description = "Lint the server"
dir = "server"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks.test-unit]
description = "Run server tests that do not require a database"
dir = "server"
run = "cargo test --locked"

[tasks.test-integration]
description = "Run ignored server integration tests"
dir = "server"
run = """
cargo test --locked --test db_mariadb -- --ignored --test-threads=1
cargo test --locked --test api_mariadb -- --ignored --test-threads=1
cargo test --locked --test problem_seeder -- --ignored --test-threads=1
cargo test --locked --lib repository::game_progress_tests -- --ignored --test-threads=1
"""

[tasks.seed-mock-problem-data]
description = "Validate and seed mock problem data into MariaDB"
dir = "server"
run = "cargo run --locked --bin seed_problem_data -- ../mock-problem-data"

[tasks.test]
description = "Run server tests that do not require a database"
dir = "server"
run = "cargo test --locked"

[tasks.server-check]
description = "Run all server checks that do not require a database"
depends = ["fmt-check", "build", "lint", "test-unit"]
run = "echo Server checks passed"

[tasks.client-install]
description = "Install locked client dependencies"
dir = "client"
run = "pnpm install --frozen-lockfile"

[tasks.client-build]
description = "Type-check and build the client"
depends = ["client-install"]
dir = "client"
run = "pnpm build"

[tasks.client-typecheck]
description = "Type-check the client"
depends = ["client-install"]
dir = "client"
run = "pnpm type-check"

[tasks.client-lint]
description = "Lint the client"
depends = ["client-install"]
dir = "client"
run = "pnpm lint"

[tasks.client-lint-fix]
description = "Lint and fix the client"
depends = ["client-install"]
dir = "client"
run = "pnpm lint:fix"

[tasks.client-format]
description = "Format the client"
depends = ["client-install"]
dir = "client"
run = "pnpm format"

[tasks.client-format-check]
description = "Check client formatting"
depends = ["client-install"]
dir = "client"
run = "pnpm format:check"

[tasks.client-test]
description = "Run client unit tests"
depends = ["client-install"]
dir = "client"
run = "pnpm test:unit"

[tasks.client-check]
description = "Run all client checks"
depends = ["client-format-check", "client-build", "client-histoire-build", "client-lint", "client-test"]
run = "echo Client checks passed"

[tasks.device-test]
description = "Run host-side tests for the MicroPython device firmware"
dir = "device"
run = "python -m unittest discover -s tests -p 'test_*.py' -v"

[tasks.check]
description = "Run all server, client, and device checks"
depends = ["server-check", "client-check", "device-test"]
run = "echo All checks passed"

[tasks.openapi-generate-server]
description = "Generate and format the Rust Axum contract crate"
dir = "openapi"
run = """
pnpm dlx @openapitools/openapi-generator-cli@2.40.1 generate --generator-key rust-server
cargo fmt --manifest-path ../server/generated/openapi/Cargo.toml --all
"""

[tasks.openapi-generate-client]
description = "Generate and format the TypeScript contract types"
depends = ["client-install"]
run = """
pnpm dlx openapi-typescript@7.13.0 openapi/openapi-v1.yaml --output client/src/generated/api.d.ts
pnpm --dir client exec prettier --write --experimental-cli src/generated/api.d.ts
"""

[tasks.openapi-generate]
description = "Generate Rust and TypeScript code from the shared OpenAPI contract"
depends = ["openapi-generate-server", "openapi-generate-client"]
run = "echo OpenAPI code generation completed"

[tasks.openapi-generate-check]
description = "Regenerate OpenAPI code and fail when committed output is stale"
depends = ["openapi-generate"]
run = """
generated_changes=$(git status --porcelain --untracked-files=all -- server/generated/openapi client/src/generated/api.d.ts)
if [ -n "$generated_changes" ]; then
  echo "$generated_changes"
  exit 1
fi
"""

[tasks.docker-build]
description = "Build the server container image"
run = "docker build ."

[tasks.server-dev]
description = "Run the server development stack with Compose watch"
run = "docker compose watch"

[tasks.client-dev]
description = "Run the Vite development server"
depends = ["client-install"]
dir = "client"
run = "pnpm dev"

[tasks.client-histoire]
description = "Run the Histoire component preview"
depends = ["client-install"]
dir = "client"
run = "pnpm histoire"

[tasks.client-histoire-build]
description = "Build the Histoire component preview"
depends = ["client-install"]
dir = "client"
run = "pnpm histoire:build"

[tasks.client-histoire-preview]
description = "Build and preview the Histoire site"
depends = ["client-histoire-build"]
dir = "client"
run = "pnpm histoire:preview"

[tasks.dev]
description = "Run the backend stack and Vite development server"
depends = ["server-dev", "client-dev"]

[tasks.compose-up]
description = "Start the server development stack"
run = "docker compose up -d"

[tasks.compose-down]
description = "Stop the server development stack"
run = "docker compose down"
