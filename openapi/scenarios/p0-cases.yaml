openapi_document: ../openapi-v1.yaml
cases:
  - id: me_neoshowcase_authenticated
    preconditions:
      auth_mode: neoshowcase
      authenticated: true
    steps:
      - operation_id: getMe
        response:
          status: 200
          example: neoshowcase_authenticated

  - id: me_neoshowcase_unauthenticated
    preconditions:
      auth_mode: neoshowcase
      authenticated: false
    steps:
      - operation_id: getMe
        response:
          status: 200
          example: neoshowcase_unauthenticated

  - id: me_demo_authenticated
    preconditions:
      auth_mode: demo
      authenticated: true
    steps:
      - operation_id: getMe
        response:
          status: 200
          example: demo_authenticated

  - id: me_demo_unauthenticated
    preconditions:
      auth_mode: demo
      authenticated: false
    steps:
      - operation_id: getMe
        response:
          status: 200
          example: demo_unauthenticated

  - id: demo_login_and_logout
    preconditions:
      auth_mode: demo
      authenticated: false
    steps:
      - operation_id: loginGuest
        request_example: guest_login
        response:
          status: 200
          example: guest_authenticated
        state_after:
          authenticated: true
      - operation_id: getMe
        response:
          status: 200
          example: demo_authenticated
      - operation_id: logoutDemo
        response:
          status: 204
        state_after:
          authenticated: false
      - operation_id: getMe
        response:
          status: 200
          example: demo_unauthenticated

  - id: neoshowcase_logout_not_found
    preconditions:
      auth_mode: neoshowcase
      authenticated: true
    steps:
      - operation_id: logoutDemo
        response:
          status: 404
        state_after:
          authenticated: true

  - id: demo_login_display_name_required
    preconditions:
      auth_mode: demo
      authenticated: false
    steps:
      - operation_id: loginGuest
        request_example: guest_login_empty
        response:
          status: 422
          example: display_name_required

  - id: demo_login_display_name_too_long
    preconditions:
      auth_mode: demo
      authenticated: false
    steps:
      - operation_id: loginGuest
        request_example: guest_login_too_long
        response:
          status: 422
          example: display_name_too_long

  - id: start_new_run
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: false
    steps:
      - operation_id: startOrResumeRun
        response:
          status: 200
          example: new_run
        state_after:
          active_run_exists: true

  - id: resume_active_run
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
    steps:
      - operation_id: startOrResumeRun
        response:
          status: 200
          example: resumed_run

  - id: get_current_run
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
    steps:
      - operation_id: getCurrentRun
        response:
          status: 200
          example: current_run

  - id: current_run_not_found
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: false
    steps:
      - operation_id: getCurrentRun
        response:
          status: 404
          example: run_not_found

  - id: game_api_unauthorized
    preconditions:
      authenticated: false
      room_exists: true
    steps:
      - operation_id: startOrResumeRun
        response:
          status: 401
          example: unauthorized

  - id: get_available_problem
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
      problem_status: available
    steps:
      - operation_id: getProblem
        response:
          status: 200
          example: available_problem

  - id: get_problem_assets
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
      problem_exists: true
      problem_status: available
      problem_has_assets: true
    steps:
      - operation_id: getProblemAssets
        response:
          status: 200
          example: listed

  - id: get_problem_assets_unauthorized
    preconditions:
      authenticated: false
      room_exists: true
      problem_exists: true
      problem_has_assets: true
    steps:
      - operation_id: getProblemAssets
        response:
          status: 401
          example: unauthorized

  - id: get_problem_assets_without_active_run
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: false
      problem_exists: true
      problem_has_assets: true
    steps:
      - operation_id: getProblemAssets
        response:
          status: 404
          example: run_not_found

  - id: get_problem_assets_not_found
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
      problem_exists: true
      problem_status: available
      problem_has_assets: false
    steps:
      - operation_id: getProblemAssets
        response:
          status: 404
          example: image_not_found

  - id: get_problem_assets_locked
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
      problem_exists: true
      problem_status: locked
      problem_has_assets: true
    steps:
      - operation_id: getProblemAssets
        response:
          status: 409
          example: problem_locked

  - id: problem_not_found
    preconditions:
      authenticated: true
      room_exists: true
      active_run_exists: true
      problem_exists: false
    steps:
      - operation_id: getProblem
        response:
          status: 404

  - id: problem_locked
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: locked
    steps:
      - operation_id: getProblem
        response:
          status: 409
          example: problem_locked

  - id: query_already_cleared
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: cleared
    steps:
      - operation_id: submitQuery
        request_example: serial_operations
        response:
          status: 409
          example: problem_already_cleared
        state_after:
          problem_status: cleared

  - id: query_invalid_source
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
    steps:
      - operation_id: submitQuery
        request_example: invalid_source
        response:
          status: 422
          example: validation_error
        state_after:
          problem_status: available

  - id: query_incorrect
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
      query_judgement: incorrect
    steps:
      - operation_id: submitQuery
        request_example: serial_operations
        response:
          status: 200
          example: incorrect_query
        state_after:
          problem_status: available

  - id: query_correct
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
      next_problem_status: locked
      query_judgement: correct
    steps:
      - operation_id: submitQuery
        request_example: serial_operations
        response:
          status: 200
          example: correct_query
        state_after:
          problem_status: cleared
          next_problem_status: available

  - id: answer_locked
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: locked
    steps:
      - operation_id: submitAnswer
        request_example: submitted_answer
        response:
          status: 409
          example: problem_locked
        state_after:
          problem_status: locked

  - id: answer_already_cleared
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: cleared
    steps:
      - operation_id: submitAnswer
        request_example: submitted_answer
        response:
          status: 409
          example: problem_already_cleared
        state_after:
          problem_status: cleared

  - id: answer_incorrect
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
      answer_judgement: incorrect
    steps:
      - operation_id: submitAnswer
        request_example: submitted_answer
        response:
          status: 200
          example: incorrect_answer
        state_after:
          problem_status: available
          run_status: active

  - id: answer_correct_and_unlock
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
      next_problem_status: locked
      answer_judgement: correct
      last_required_problem: false
    steps:
      - operation_id: submitAnswer
        request_example: submitted_answer
        response:
          status: 200
          example: correct_answer_unlocks_problem
        state_after:
          problem_status: cleared
          next_problem_status: available
          run_status: active

  - id: answer_correct_and_clear_run
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
      answer_judgement: correct
      last_required_problem: true
    steps:
      - operation_id: submitAnswer
        request_example: submitted_answer
        response:
          status: 200
          example: correct_answer_clears_run
        state_after:
          problem_status: cleared
          run_status: cleared
          active_run_exists: false
          cleared_run_exists: true

  - id: answer_input_too_long
    preconditions:
      authenticated: true
      active_run_exists: true
      problem_status: available
      answer_max_length: 50
    steps:
      - operation_id: submitAnswer
        request_example: too_long_for_example_problem
        response:
          status: 422

  - id: invalid_room_id_format
    preconditions:
      authenticated: true
      room_id_format: invalid_uuid
    steps:
      - operation_id: getCurrentRun
        response:
          status: 400

  - id: rooms_unauthenticated
    preconditions:
      authenticated: false
    steps:
      - operation_id: getRooms
        response:
          status: 200
          example: unauthenticated

  - id: rooms_authenticated_active
    preconditions:
      authenticated: true
      active_run_exists: true
    steps:
      - operation_id: getRooms
        response:
          status: 200
          example: authenticated_active

  - id: rooms_authenticated_cleared
    preconditions:
      authenticated: true
      cleared_run_exists: true
    steps:
      - operation_id: getRooms
        response:
          status: 200
          example: authenticated_cleared

  - id: rooms_empty
    preconditions:
      published_rooms_count: 0
    steps:
      - operation_id: getRooms
        response:
          status: 200
          example: empty

  - id: room_detail_active
    preconditions:
      authenticated: true
      active_run_exists: true
    steps:
      - operation_id: getRoom
        response:
          status: 200
          example: active

  - id: room_detail_not_started
    preconditions:
      authenticated: false
    steps:
      - operation_id: getRoom
        response:
          status: 200
          example: not_started

  - id: room_detail_cleared
    preconditions:
      authenticated: true
      run_status: cleared
    steps:
      - operation_id: getRoom
        response:
          status: 200
          example: cleared

