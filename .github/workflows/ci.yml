name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      client: ${{ steps.scope.outputs.client }}
      device: ${{ steps.scope.outputs.device }}
      server: ${{ steps.scope.outputs.server }}
      integration: ${{ steps.scope.outputs.integration }}
      openapi: ${{ steps.scope.outputs.openapi }}
      docker: ${{ steps.scope.outputs.docker }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            changed_files=$(git ls-tree -r --name-only "$HEAD_SHA")
          else
            changed_files=$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
          fi

          client=false
          device=false
          server=false
          integration=false
          openapi=false
          docker=false
          full=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/*|.github/scripts/*|mise.toml|Cargo.lock)
                full=true
                ;;
              Dockerfile)
                docker=true
                ;;
              device/*)
                device=true
                ;;
              client/src/generated/*|server/generated/openapi/*|openapi/openapi-v1.yaml|openapi/openapitools.json|openapi/templates/*|openapi/examples/*|openapi/scenarios/*)
                client=true
                server=true
                integration=true
                openapi=true
                ;;
              server/Cargo.toml|server/Cargo.lock)
                server=true
                integration=true
                docker=true
                ;;
              server/migrations/*|server/src/repository.rs|server/src/repository/*|server/src/problem/*|server/tests/*|mock-problem-data/*)
                server=true
                integration=true
                ;;
              server/src/*|server/build.rs)
                server=true
                ;;
              client/src/*|client/public/*|client/*.json|client/*.ts|client/index.html|client/package.json|client/pnpm-lock.yaml|client/pnpm-workspace.yaml)
                client=true
                ;;
              *.md)
                ;;
              *)
                full=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$full" == true ]]; then
            client=true
            device=true
            server=true
            integration=true
            openapi=true
            docker=true
          fi

          {
            echo "client=$client"
            echo "device=$device"
            echo "server=$server"
            echo "integration=$integration"
            echo "openapi=$openapi"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"

          echo "client=$client"
          echo "device=$device"
          echo "server=$server"
          echo "integration=$integration"
          echo "openapi=$openapi"
          echo "docker=$docker"

  client:
    name: Client Check
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run client-check

  device:
    name: Device Test
    needs: changes
    if: needs.changes.outputs.device == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run device-test

  server:
    name: Server Check
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run server-check

  integration:
    name: Server Integration Test
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: mysql://test:test@127.0.0.1:3306/test
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run test-integration

  openapi:
    name: OpenAPI Generated Code Check
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run openapi-generate-check

  docker:
    name: Docker Build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: mise run docker-build

  required:
    name: Required Checks
    if: always()
    needs: [changes, client, device, server, integration, openapi, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a required scope check failed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          DEVICE_RESULT: ${{ needs.device.result }}
          SERVER_RESULT: ${{ needs.server.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          OPENAPI_RESULT: ${{ needs.openapi.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail

          for result in \
            "$CHANGES_RESULT" \
            "$CLIENT_RESULT" \
            "$DEVICE_RESULT" \
            "$SERVER_RESULT" \
            "$INTEGRATION_RESULT" \
            "$OPENAPI_RESULT" \
            "$DOCKER_RESULT"; do
            if [[ "$result" != success && "$result" != skipped ]]; then
              exit 1
            fi
          done
