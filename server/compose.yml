services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: 0.0.0.0:8080
      DB_USER: root
      DB_PASS: pass
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: app
      PHOTO_API_URL: https://jsonplaceholder.typicode.com/photos
      RUST_LOG: server=info,tower_http=info
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - target/
        - action: rebuild
          path: ../openapi

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: app
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=localhost", "--user=root", "--password=pass"]
      interval: 1s
      timeout: 10s
      retries: 30

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
